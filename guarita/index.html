<style>
:root{
  color-scheme:dark;
  --ground:#0C1116;
  --surface:#141A21;
  --surface-2:#1D242C;
  --surface-3:#242D36;
  --line:#28313A;
  --line-soft:#1F272F;
  --ink:#F7F4EC;
  --ink-2:#B8BDC3;
  --ink-3:#7F878F;
  --ink-4:#5A636C;
  --gold:#C2A468;
  --gold-lt:#E0CB9A;
  --gold-dk:#967F4E;
  --gold-dkr:#6D5C3A;
  --pos:#3FB87A;
  --warn:#D4A04A;
  --neg:#DC6363;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
html[data-tema="claro"]{
  color-scheme:light;
  --ground:#F4F1EB; --surface:#FFFFFF; --surface-2:#EDE9E0; --surface-3:#E3DED2;
  --line:#D8D2C4; --line-soft:#E7E2D7;
  --ink:#191E25; --ink-2:#4C555F; --ink-3:#7C8792; --ink-4:#A6AEB8;
  --gold:#9C7C31; --gold-lt:#C4A55F; --gold-dk:#7C6224; --gold-dkr:#DCCFA8;
  --pos:#2E8B57; --warn:#B07A16; --neg:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--gold-lt);text-decoration:none}

/* ── esqueleto ───────────────────────────────────────── */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.marca{padding:16px 18px 14px;border-bottom:1px solid var(--line-soft)}
.marca .n{font-family:var(--serif);font-size:21px;letter-spacing:.06em;color:var(--gold)}
.marca .s{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.menu{flex:1;overflow-y:auto;padding:10px 8px}
.menu .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink-2);position:relative}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--surface-3);color:var(--ink)}
.nav.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--gold)}
.nav .ic{width:20px;text-align:center;font-size:15px;opacity:.9}
.nav .kb{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.nav .bd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--gold-dkr);color:var(--ink);border-radius:20px;padding:1px 7px}
.nav .bd.al{background:var(--neg);color:#fff}
.rodape{padding:10px 12px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-4);display:flex;gap:8px;align-items:center;justify-content:space-between}
.rodape button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink-3);padding:3px 8px;cursor:pointer;font-size:11px}

.main{display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.top .tit{font-family:var(--serif);font-size:19px}
.top .sub{font-size:12px;color:var(--ink-3)}
.relogio{margin-left:auto;text-align:right;line-height:1.15}
.relogio .h{font-family:var(--mono);font-size:26px;letter-spacing:.02em}
.relogio .d{font-size:11px;color:var(--ink-3);text-transform:capitalize}
.turno-chip{display:flex;flex-direction:column;padding:4px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.turno-chip .a{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}
.turno-chip .b{font-size:13px}
.btn-sos{background:var(--neg);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;letter-spacing:.06em;cursor:pointer;box-shadow:0 0 0 0 rgba(220,99,99,.6);animation:pulso 2.6s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(220,99,99,.45)}70%{box-shadow:0 0 0 12px rgba(220,99,99,0)}100%{box-shadow:0 0 0 0 rgba(220,99,99,0)}}
@media (prefers-reduced-motion:reduce){.btn-sos{animation:none}}
.corpo{flex:1;overflow-y:auto;padding:18px 20px 40px}

/* ── blocos ──────────────────────────────────────────── */
.faixa{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);margin-bottom:14px;font-size:13px}
.faixa.av{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.faixa.pg{border-color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,var(--surface))}
.faixa .esp{margin-left:auto}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.cartao > h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:8px}
.cartao > h3 .esp{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-4)}
.cartao .cnt{padding:14px}
.cartao .cnt.rente{padding:0}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4,.g3,.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.kpi:hover{border-color:var(--gold-dk)}
.kpi .r{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}
.kpi .v{font-family:var(--mono);font-size:30px;line-height:1.1;margin-top:4px}
.kpi .o{font-size:11px;color:var(--ink-3)}
.kpi.al{border-color:var(--neg)} .kpi.al .v{color:var(--neg)}
.kpi.at{border-color:var(--warn)} .kpi.at .v{color:var(--warn)}

.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line)}
.tb td{padding:9px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr:hover{background:var(--surface-2)}
.tb .num{font-family:var(--mono)}
.vazio{padding:26px 14px;text-align:center;color:var(--ink-4);font-size:13px}

.et{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.et.ok{border-color:var(--pos);color:var(--pos)}
.et.at{border-color:var(--warn);color:var(--warn)}
.et.ng{border-color:var(--neg);color:var(--neg)}
.et.gd{border-color:var(--gold-dk);color:var(--gold-lt)}

.b{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.b:hover{border-color:var(--gold-dk)}
.b.p{background:var(--gold);border-color:var(--gold);color:#14100A;font-weight:600}
.b.p:hover{background:var(--gold-lt)}
.b.d{background:var(--neg);border-color:var(--neg);color:#fff}
.b.s{padding:4px 9px;font-size:12px}
.b:disabled{opacity:.4;cursor:not-allowed}
.linha-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

label.cp{display:block;margin-bottom:10px}
label.cp > span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
textarea{min-height:78px;resize:vertical}
.dica{font-size:11px;color:var(--ink-4);margin-top:3px}

.pill{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0}
.mono{font-family:var(--mono)}
.mut{color:var(--ink-3)}
.peq{font-size:12px}
.dir{text-align:right}

/* ── quadro de chaves ────────────────────────────────── */
.quadro{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.gancho{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;position:relative}
.gancho:hover{border-color:var(--gold-dk)}
.gancho .g{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.gancho .c{font-family:var(--mono);font-size:15px;color:var(--gold-lt)}
.gancho .d{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gancho.fora{background:color-mix(in srgb,var(--neg) 14%,var(--surface));border-color:var(--neg)}
.gancho.fora .c{color:var(--neg)}
.gancho .q{font-size:11px;color:var(--neg);margin-top:3px}

/* ── modal ───────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(4,7,10,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.scrim.on{display:flex}
.folha{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.folha.larga{width:min(1080px,100%)}
.folha .fh{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.folha .fh h4{margin:0;font-family:var(--serif);font-size:18px;font-weight:500}
.folha .fh .s{font-size:12px;color:var(--ink-3)}
.folha .fh .x{margin-left:auto;background:none;border:0;color:var(--ink-3);font-size:18px;cursor:pointer;padding:2px 6px}
.folha .fb{padding:16px 18px;overflow-y:auto}
.folha .ff{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}
.torrada{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);border-radius:9px;padding:10px 18px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.torrada.on{opacity:1}
.torrada.ok{border-color:var(--pos)} .torrada.ng{border-color:var(--neg)}

/* ── passos de emergência ────────────────────────────── */
.passo{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--surface-2);cursor:pointer}
.passo:hover{border-color:var(--gold-dk)}
.passo.feito{background:color-mix(in srgb,var(--pos) 12%,var(--surface));border-color:var(--pos)}
.passo .n{font-family:var(--mono);width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px}
.passo.feito .n{background:var(--pos);border-color:var(--pos);color:#08130C}
.passo .t{flex:1}
.passo .hr{font-family:var(--mono);font-size:12px;color:var(--pos)}
.nunca{border-left:3px solid var(--neg);padding:8px 12px;background:color-mix(in srgb,var(--neg) 8%,transparent);border-radius:0 6px 6px 0;font-size:13px;margin-top:10px}
.cen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;width:100%}
.cen:hover{border-color:var(--neg)}
.cen .e{font-size:22px}
.cen .n{font-family:var(--serif);font-size:16px;margin-top:6px}
.cen .q{font-size:12px;color:var(--ink-3);margin-top:3px}

@media print{
  .side,.top,.linha-b,.noprint{display:none!important}
  .app{display:block;height:auto}.corpo{overflow:visible;padding:0}
  body{background:#fff;color:#000}
  .cartao{border-color:#bbb;break-inside:avoid}
}
</style>

/* ── formatação ─────────────────────────────────────── */
function pad2(n){ return (n<10?'0':'')+n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dt(iso){ if(!iso) return '—'; var d = new Date(iso);
  return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function hm(iso){ if(!iso) return '—'; var d = new Date(iso); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function dia(iso){ var d = iso ? new Date(iso) : new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function mes(iso){ return dia(iso).slice(0,7); }
function decorrido(iso){
  if(!iso) return '—';
  var m = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if(m < 60) return m+' min';
  var h = Math.floor(m/60);
  if(h < 24) return h+'h'+pad2(m%60);
  return Math.floor(h/24)+'d '+(h%24)+'h';
}
function brl(v){ return 'R$ ' + (Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function brl0(v){ return 'R$ ' + Math.round(v).toLocaleString('pt-BR'); }
function guarda(){ return S.turno ? S.turno.guarda : 'sem turno aberto'; }
function un(cod){ for(var i=0;i<S.unidades.length;i++){ if(S.unidades[i].cod===cod) return S.unidades[i]; } return null; }

/* campos: {id, rot, tipo:'texto|num|sel|area|data|hora|tel', opts:[], val, dica, largo} */
function campos(cs){
  return '<div class="grade g2">' + cs.map(function(c){
    var w = c.largo ? ' style="grid-column:1/-1"' : '';
    var v = esc(c.val==null?'':c.val), i;
    if(c.tipo === 'sel')
      i = '<select id="c_'+c.id+'">' + (c.opts||[]).map(function(o){
        var t = (typeof o === 'object') ? o.t : o, val = (typeof o === 'object') ? o.v : o;
        return '<option value="'+esc(val)+'"'+(String(val)===String(c.val)?' selected':'')+'>'+esc(t)+'</option>'; }).join('') + '</select>';
    else if(c.tipo === 'area') i = '<textarea id="c_'+c.id+'">'+v+'</textarea>';
    else i = '<input type="'+(c.tipo==='num'?'number':c.tipo==='data'?'date':c.tipo==='hora'?'time':'text')+
      '" id="c_'+c.id+'" value="'+v+'"'+(c.tipo==='num'?' step="0.01"':'')+(c.ph?' placeholder="'+esc(c.ph)+'"':'')+'>';
    return '<label class="cp"'+w+'><span>'+esc(c.rot)+'</span>'+i+
      (c.dica?'<span class="dica">'+esc(c.dica)+'</span>':'')+'</label>';
  }).join('') + '</div>';
}
function ler(id){ var e = document.getElementById('c_'+id); return e ? e.value.trim() : ''; }
function lerNum(id){ var v = parseFloat(ler(id).replace(',','.')); return isNaN(v) ? 0 : v; }

function tabela(cols, linhas, vazio){

  return '<table class="tb"><thead><tr>' + cols.map(function(c){
    return '<th'+(c.dir?' class="dir"':'')+'>'+esc(c.t)+'</th>'; }).join('') +
    '</tr></thead><tbody>' + linhas.join('') + '</tbody></table>';
}
function cartao(titulo, corpo, extra, rente){

    '</h3><div class="cnt'+(rente?' rente':'')+'">'+corpo+'</div></div>';

/* Cada item do menu mostra um número. O que é pendência fica vermelho;
   o resto é só o tamanho do cadastro, para nada aparecer vazio. */
function contadores(){
  var c = {}, hoje = dia();
  var dentro = S.acessos.filter(function(a){ return !a.saida; }).length;
  var pend = S.encomendas.filter(function(e){ return !e.retiradoEm; }).length;
  var fora = S.chaves.filter(function(k){ return k.estado !== 'no quadro'; }).length;
  var graves = S.ocorrencias.filter(function(o){ return !o.fechada && o.grav === 'Grave'; }).length;
  var off = S.cameras.filter(function(x){ return x.st !== 'on'; }).length;
  var emAberto = S.emergencias.filter(function(e){ return !e.fim; }).length;
  var rondasHoje = S.rondas.filter(function(r){ return dia(r.inicio) === hoje; }).length;
  var atend = S.atendimentos.filter(function(a){ return a.status !== 'Resolvido'; }).length;
  var semConf = S.contatos.filter(function(x){ return !x.verificadoEm; }).length;
  var vendasHoje = S.vendas.filter(function(v){ return dia(v.quando) === hoje; }).length;

  c.painel     = { n:eventos().filter(function(e){ return dia(e.q) === hoje; }).length };
  c.acessos    = { n:dentro, al:dentro > 8 };
  c.encomendas = { n:pend };
  c.chaves     = { n:fora, al:fora > 3 };
  c.rondas     = { n:rondasHoje + '/' + HORARIOS_RONDA.length, al:rondasHoje === 0 };
  c.cameras    = { n:off || S.cameras.length, al:off > 2 };
  c.recepcao   = { n:atend, al:atend > 4 };
  c.alunos     = { n:S.unidades.length };
  c.telefones  = { n:S.contatos.length, al:semConf > 6 };
  c.emergencia = { n:emAberto || POPS.length, al:emAberto > 0 };
  c.ocorrencias= { n:graves || S.ocorrencias.length, al:graves > 0 };
  c.caixa      = { n:vendasHoje || S.vendas.length };
  c.auditoria  = { n:S.lancamentos.length };
  c.turno      = { n:S.turno ? 'aberto' : 'fechado', al:!S.turno };
  c.manual     = { n:MANUAL.length };
  c.dados      = { n:S.unidades.length + S.acessos.length + S.ocorrencias.length + S.lancamentos.length };
  return c;
}

function eventos(){
  var e = [];
  S.acessos.forEach(function(a){
    e.push({ q:a.entrada, ic:'⇢', t:'Entrada · '+a.nome, s:a.tipo+(a.unidade?' → '+a.unidade:'') });
    if(a.saida) e.push({ q:a.saida, ic:'⇠', t:'Saída · '+a.nome, s:'permaneceu '+a.permanencia });
  });
  S.encomendas.forEach(function(x){
    e.push({ q:x.recebidoEm, ic:'✉', t:'Encomenda recebida · '+x.unidade, s:x.transportadora });
    if(x.retiradoEm) e.push({ q:x.retiradoEm, ic:'✔', t:'Encomenda retirada · '+x.unidade, s:x.retiradoPor });
  });
  S.chavesHist.forEach(function(h){
    e.push({ q:h.retirada, ic:'⚿', t:'Chave '+h.cod+' retirada', s:h.quem });
    if(h.devolucao) e.push({ q:h.devolucao, ic:'⚿', t:'Chave '+h.cod+' devolvida', s:h.quem });
  });
  S.ocorrencias.forEach(function(o){ e.push({ q:o.quando, ic:o.grav==='Grave'?'⚠':'▤', t:o.titulo, s:o.tipo }); });
  S.rondas.forEach(function(r){ e.push({ q:r.inicio, ic:'◷', t:'Ronda iniciada', s:r.por }); });
  S.vendas.forEach(function(v){ e.push({ q:v.quando, ic:'▣', t:'Venda · '+v.item, s:brl(v.total) }); });
  S.atendimentos.forEach(function(a){ e.push({ q:a.quando, ic:'☏', t:'Atendimento · '+a.tipo, s:a.solicitante }); });
  return e.filter(function(x){ return x.q; }).sort(function(a,b){ return a.q < b.q ? 1 : -1; });
}

function novaRonda(horario){

    pontos:{}, obs:'', fim:null };

function rondaAberta(id){

  function corpo(){
    return '<p class="peq mut">Marque cada ponto no momento em que você estiver nele. A hora é gravada sozinha.</p>' +
      PONTOS.map(function(p,i){
        var f = r.pontos[i];
        return '<div class="passo'+(f?' feito':'')+'" data-ponto="'+i+'">' +

      }).join('') +
      campos([{ id:'obs', rot:'O que você viu de diferente', tipo:'area', largo:true, val:r.obs }]);
  }
  folha('Ronda ' + (r.horario || 'extra'), 'Iniciada às ' + hm(r.inicio) + ' por ' + r.por, corpo(),
    [ { txt:'Continuar depois', fn:function(){ r.obs = ler('obs'); gravar(); fechar(); pintar(); } },
      { txt:'Encerrar ronda', cls:'p', fn:function(){
        r.obs = ler('obs'); r.fim = agora(); gravar(); fechar(); pintar();
        var n = Object.keys(r.pontos).length;
        if(r.obs) registrar('Ronda','Informação','Ronda '+(r.horario||'extra')+' com observação', r.obs, true);
        torrada('Ronda encerrada', n+' de '+PONTOS.length+' pontos', n===PONTOS.length?'ok':'');

function abrirPop(id, emgId){
  var p = null; POPS.forEach(function(x){ if(x.id === id) p = x; });
  if(!p) return;
  var e = null;
  if(emgId){ S.emergencias.forEach(function(x){ if(x.id === emgId) e = x; }); }
  if(!e){
    e = { id:uid('em'), cenario:p.nome, pop:p.id, inicio:agora(), por:guarda(), passos:{}, notas:'', fim:null };
    S.emergencias.unshift(e); gravar();
    registrar('Emergência','Grave','Emergência aberta: '+p.nome,'Processo iniciado na guarita.', true);
  }
  function corpo(){
    return '<div class="faixa pg">Aberta às '+hm(e.inicio)+' por '+esc(e.por)+' — cada passo grava a hora em que foi feito.</div>' +
      p.passos.map(function(t,i){
        var f = e.passos[i];
        return '<div class="passo'+(f?' feito':'')+'" data-pp="'+i+'"><div class="n">'+(i+1)+'</div>' +
          '<div class="t">'+esc(t)+'</div><div class="hr">'+(f?hm(f):'')+'</div></div>';
      }).join('') +
      '<div class="nunca"><strong>Nunca:</strong> ' + p.nunca.map(esc).join(' · ') + '</div>' +
      campos([{ id:'notas', rot:'O que aconteceu, com hora', tipo:'area', largo:true, val:e.notas }]);
  }
  folha(p.e + '  ' + p.nome, p.q, corpo(),
    [ { txt:'Sair sem encerrar', fn:function(){ e.notas = ler('notas'); gravar(); fechar(); pintar(); } },
      { txt:'Encerrar e lançar no livro', cls:'p', fn:function(){
        e.notas = ler('notas'); e.fim = agora();
        var linha = p.passos.map(function(t,i){
          return (e.passos[i] ? hm(e.passos[i]) : 'não feito') + ' — ' + t; }).join('\n');
        registrar('Emergência','Grave','Encerrada: '+p.nome,
          'Aberta ' + dt(e.inicio) + ', encerrada ' + dt(e.fim) + '.\n\n' + linha +
          (e.notas ? '\n\nRelato: ' + e.notas : ''), true);
        gravar(); fechar(); pintar(); torrada('Emergência encerrada','Linha do tempo foi para o livro','ok');
      } } ], true);
  document.getElementById('fBody').addEventListener('click', function(ev){
    var el = ev.target.closest('[data-pp]'); if(!el) return;
    var i = el.getAttribute('data-pp');
    if(e.passos[i]) delete e.passos[i]; else e.passos[i] = agora();
    gravar();
    var n = ler('notas');
    document.getElementById('fBody').innerHTML = corpo();
    var en = document.getElementById('c_notas'); if(en) en.value = n;
  });
}

function fecharCaixa(){
  var t = S.turno;
  var desde = t ? t.inicio : dia() + 'T00:00:00';
  var vs = S.vendas.filter(function(v){ return v.quando >= desde; });
  var porForma = {};
  vs.forEach(function(v){ porForma[v.forma] = (porForma[v.forma]||0) + v.total; });
  var total = vs.reduce(function(a,v){ return a + v.total; }, 0);

    '<div class="faixa" style="margin-top:12px">Total do turno: <strong>'+brl(total)+'</strong> em '+vs.length+' vendas</div>' +
    campos([{ id:'contado', rot:'Dinheiro contado na gaveta (R$)', tipo:'num' },
      { id:'obs', rot:'Observação do fechamento', tipo:'area', largo:true }]),
    [ { txt:'Cancelar', fn:fechar },
      { txt:'Registrar fechamento', cls:'p', fn:function(){

          'Fechamento de caixa: ' + brl(total),
          'Esperado em dinheiro ' + brl(esperado) + ', contado ' + brl(contado) +
          ', diferença ' + brl(dif) + '. ' + ler('obs'), true);
        gravar(); fechar(); pintar();
        torrada('Caixa fechado', Math.abs(dif) > 0.01 ? 'Diferença de ' + brl(dif) : 'Bateu certo',
          Math.abs(dif) > 0.01 ? 'ng' : 'ok');
      } } ]);

var ANO_FILTRO = String(new Date().getFullYear());

function v_auditoria(){
  var ano = ANO_FILTRO;
  var doAno = S.lancamentos.filter(function(l){ return dia(l.quando).slice(0,4) === ano; });
  var ent = doAno.filter(function(l){ return l.sentido === 'entrada'; });
  var sai = doAno.filter(function(l){ return l.sentido === 'saida'; });
  var tE = ent.reduce(function(a,l){ return a + l.valor; }, 0);
  var tS = sai.reduce(function(a,l){ return a + l.valor; }, 0);
  var res = tE - tS;
  var semNota = sai.filter(function(l){ return !l.nota; });
  var tSemNota = semNota.reduce(function(a,l){ return a + l.valor; }, 0);

  /* receita potencial dos 19 apartamentos, base 10/08/2026 */
  var potMes = S.unidades.reduce(function(a,u){ return a + PRODUTOS[u.tipo].preco; }, 0);

  var meses = {};
  doAno.forEach(function(l){
    var m = mes(l.quando);
    meses[m] = meses[m] || { e:0, s:0 };
    meses[m][l.sentido === 'entrada' ? 'e' : 's'] += l.valor;
  });
  var linhasMes = Object.keys(meses).sort().reverse().map(function(m){
    var x = meses[m], r = x.e - x.s;
    return '<tr><td class="mono">'+esc(m)+'</td><td class="dir num">'+brl(x.e)+'</td>' +
      '<td class="dir num">'+brl(x.s)+'</td>' +
      '<td class="dir num" style="color:'+(r>=0?'var(--pos)':'var(--neg)')+'">'+brl(r)+'</td></tr>';
  });

  var porCat = {};
  sai.forEach(function(l){ porCat[l.categoria] = (porCat[l.categoria]||0) + l.valor; });
  var linhasCat = Object.keys(porCat).sort(function(a,b){ return porCat[b] - porCat[a]; }).map(function(k){
    var pc = tS ? (porCat[k]/tS*100) : 0;
    return '<tr><td>'+esc(k)+'</td><td class="dir num">'+brl(porCat[k])+'</td>' +
      '<td class="dir num">'+pc.toFixed(1)+'%</td>' +
      '<td><div style="height:6px;border-radius:4px;background:var(--gold);width:'+Math.max(2,pc)+'%"></div></td></tr>';
  });

  var ult = S.lancamentos.slice(0,40).map(function(l){
    return '<tr><td class="num mut">'+dt(l.quando)+'</td>' +
      '<td>'+(l.sentido==='entrada'?'<span class="et ok">entrada</span>':'<span class="et ng">saída</span>')+'</td>' +
      '<td>'+esc(l.categoria)+'<div class="peq mut">'+esc(l.desc)+'</div></td>' +
      '<td>'+esc(l.fornecedor||'—')+'</td><td class="dir num">'+brl(l.valor)+'</td>' +
      '<td>'+esc(l.forma)+'</td>' +
      '<td>'+(l.sentido==='saida' ? (l.nota?'<span class="et ok">com nota</span>':'<span class="et at">sem nota</span>') : '')+'</td>' +
      '<td class="dir"><button class="b s" data-lanc="'+l.id+'">Ver</button></td></tr>';
  });

  var anos = {};
  S.lancamentos.forEach(function(l){ anos[dia(l.quando).slice(0,4)] = 1; });
  anos[String(new Date().getFullYear())] = 1;

  return avisoDemo() + '<div class="linha-b" style="margin-bottom:14px">' +
      '<button class="b p" data-act="novaSaida">Lançar gasto ou compra</button>' +
      '<button class="b" data-act="novaEntrada">Lançar recebimento</button>' +
      '<select id="selAno" style="max-width:140px">' + Object.keys(anos).sort().reverse().map(function(a){
        return '<option'+(a===ano?' selected':'')+'>'+a+'</option>'; }).join('') + '</select>' +
      '<button class="b" onclick="window.print()">Imprimir o ano</button>' +
    '</div>' +
    '<div class="grade g4" style="margin-bottom:14px">' +
      '<div class="kpi"><div class="r">Entrou em '+ano+'</div><div class="v" style="font-size:24px;color:var(--pos)">'+brl0(tE)+'</div><div class="o">'+ent.length+' lançamentos</div></div>' +
      '<div class="kpi"><div class="r">Saiu em '+ano+'</div><div class="v" style="font-size:24px;color:var(--neg)">'+brl0(tS)+'</div><div class="o">'+sai.length+' lançamentos</div></div>' +
      '<div class="kpi'+(res<0?' al':'')+'"><div class="r">Resultado do ano</div><div class="v" style="font-size:24px">'+brl0(res)+'</div>' +
        '<div class="o">'+(res>=0?'ganho':'prejuízo')+' apurado</div></div>' +
      '<div class="kpi'+(tSemNota?' at':'')+'"><div class="r">Gasto sem nota</div><div class="v" style="font-size:24px">'+brl0(tSemNota)+'</div>' +
        '<div class="o">'+semNota.length+' lançamentos sem comprovante</div></div>' +
    '</div>' +
    '<div class="faixa">∑ O resultado acima usa só o que foi lançado aqui. Receita cheia dos 19 apartamentos, ' +
      'a preço de 10/08/2026, seria <strong>'+brl0(potMes)+'</strong> por mês — ' + brl0(potMes*12) + ' no ano, ' +
      'com ocupação total. A diferença entre esse número e a coluna de entrada é o que a operação deixou na mesa.</div>' +
    '<div class="grade g2">' +
      cartao('Mês a mês', tabela([{t:'Mês'},{t:'Entrou',dir:true},{t:'Saiu',dir:true},{t:'Resultado',dir:true}],
        linhasMes, 'Nenhum lançamento em ' + ano), '', true) +
      cartao('Para onde foi o dinheiro', tabela([{t:'Categoria'},{t:'Valor',dir:true},{t:'%',dir:true},{t:''}],
        linhasCat, 'Nenhuma saída lançada.'), '', true) +
    '</div>' +
    cartao('Lançamentos',
      tabela([{t:'Quando'},{t:'Sentido'},{t:'Categoria'},{t:'Fornecedor'},{t:'Valor',dir:true},{t:'Forma'},{t:'Nota'},{t:'',dir:true}],
        ult, 'Nada lançado ainda. Todo gasto do condomínio entra aqui — é isso que fecha o ano.'),
      esc(S.lancamentos.length + ' no total'), true);
}

    [ { txt:'Cancelar', fn:fechar },
      { txt:'Fechar e passar', cls:'p', fn:function(){
        t.fim = agora(); t.pendencias = ler('pend'); t.passouPara = ler('quem');
        t.acessos = ac.length; t.ocorrencias = oc.length; t.chavesFora = fora.length;

        registrar('Turno','Informação','Turno de ' + t.guarda + ' encerrado',
          'Passado para ' + (t.passouPara || 'não informado') + '. ' +
          dentro.length + ' pessoas dentro, ' + fora.length + ' chaves fora, ' +

        torrada('Turno fechado', 'Passagem registrada no livro', 'ok');
      } } ], true);

function _min(m){ return new Date(Date.now() - m*60000).toISOString(); }
function _dias(d, h, mi){
  var x = new Date(); x.setDate(x.getDate() - d);
  x.setHours(h==null?10:h, mi==null?0:mi, 0, 0);

function exportar(){
  var nome = 'm7m-guarita-' + dia() + '.json';
  var blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  torrada('Backup gerado', nome + ' — guarde no NAS', 'ok');
}
function importar(){
  var inp = document.getElementById('arq'); if(!inp) return;
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      var dados;
      try{ dados = JSON.parse(r.result); }
      catch(e){ torrada('Arquivo inválido','Não é um backup deste sistema','ng'); return; }
      if(!dados.unidades){ torrada('Arquivo inválido','Falta o cadastro de unidades','ng'); return; }
      folha('Importar backup', f.name,
        '<div class="faixa pg">Isto substitui tudo que está gravado neste computador pelo conteúdo do arquivo. ' +
        'Se o que está na tela ainda não foi exportado, cancele e exporte primeiro.</div>' +
        '<div class="peq">O arquivo traz: '+ (dados.unidades||[]).length +' unidades, '+
        (dados.acessos||[]).length +' acessos, '+ (dados.ocorrencias||[]).length +' ocorrências, '+
        (dados.lancamentos||[]).length +' lançamentos.</div>',
        [ { txt:'Cancelar', fn:fechar },
          { txt:'Exportar o atual antes', fn:function(){ exportar(); } },
          { txt:'Substituir agora', cls:'d', fn:function(){
            S = dados; gravar(); fechar(); pintar(); torrada('Backup importado','','ok'); } } ]);
    };
    r.readAsText(f);
  };
  inp.click();
}

  if((el = t.closest('[data-ir]'))){ ir(el.getAttribute('data-ir')); return; }
  if((el = t.closest('[data-act]'))){ acao(el.getAttribute('data-act'), el.getAttribute('data-tipo')); return; }
  if((el = t.closest('[data-saida]'))){ registrarSaida(el.getAttribute('data-saida')); return; }
  if((el = t.closest('[data-crach]'))){ cracha(el.getAttribute('data-crach')); return; }
  if((el = t.closest('[data-retirar]'))){ retirarEncomenda(el.getAttribute('data-retirar')); return; }
  if((el = t.closest('[data-chave]'))){ abrirChave(el.getAttribute('data-chave')); return; }
  if((el = t.closest('[data-ronda]'))){ novaRonda(el.getAttribute('data-ronda')); return; }
  if((el = t.closest('[data-cam]'))){ alterarCamera(el.getAttribute('data-cam')); return; }
  if((el = t.closest('[data-pop]'))){ abrirPop(el.getAttribute('data-pop')); return; }
  if((el = t.closest('[data-emg]'))){
    var id = el.getAttribute('data-emg'), e = null;
    S.emergencias.forEach(function(x){ if(x.id === id) e = x; });
    if(e) abrirPop(e.pop, e.id);
    return;
  }
  if((el = t.closest('[data-oc]'))){ verOcorrencia(el.getAttribute('data-oc')); return; }
  if((el = t.closest('[data-un]'))){ fichaUnidade(el.getAttribute('data-un')); return; }
  if((el = t.closest('[data-fone]'))){ editarContato(el.getAttribute('data-fone')); return; }
  if((el = t.closest('[data-atend]'))){ verAtendimento(el.getAttribute('data-atend')); return; }
  if((el = t.closest('[data-lanc]'))){ verLancamento(el.getAttribute('data-lanc')); return; }
  if((el = t.closest('[data-quitar]'))){
    var vid = el.getAttribute('data-quitar');
    S.vendas.forEach(function(v){ if(v.id === vid){ v.quitado = true; v.quitadoEm = agora(); } });
    gravar(); pintar(); torrada('Fiado quitado','','ok');
    return;
  }
  if(t.id === 'fX' || t.id === 'scrim') fechar();
  if(t.id === 'btSos') ir('emergencia');
  if(t.id === 'btTema') trocarTema();
});

document.addEventListener('input', function(ev){
  if(ev.target.id === 'bsc'){
    BUSCA = ev.target.value;
    var pos = ev.target.selectionStart;
    pintar();
    var novo = document.getElementById('bsc');
    if(novo){ novo.focus(); novo.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', function(ev){
  if(ev.target.id === 'selAno'){ ANO_FILTRO = ev.target.value; pintar(); }
});
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape'){ fechar(); return; }
  if(ev.altKey && ev.key >= '1' && ev.key <= '9'){
    var ordem = ['painel','acessos','encomendas','chaves','rondas','cameras','recepcao','alunos','telefones'];
    var v = ordem[+ev.key - 1];
    if(v){ ev.preventDefault(); fechar(); ir(v); }
  }
});
function trocarTema(){
  S.tema = S.tema === 'claro' ? 'escuro' : 'claro';
  document.documentElement.setAttribute('data-tema', S.tema === 'claro' ? 'claro' : 'escuro');
  gravar();
}

/* ══════════════════════════════════════════════════════════════
   REGISTRO DAS TELAS
   As funções vivem dentro do módulo, então a navegação usa este
   mapa — não o objeto window.
   ══════════════════════════════════════════════════════════════ */
TELAS = {
  painel:v_painel, acessos:v_acessos, encomendas:v_encomendas, chaves:v_chaves,
  rondas:v_rondas, cameras:v_cameras, recepcao:v_recepcao, alunos:v_alunos,
  telefones:v_telefones, emergencia:v_emergencia, ocorrencias:v_ocorrencias,
  caixa:v_caixa, auditoria:v_auditoria, turno:v_turno, manual:v_manual, dados:v_dados
};

/* ══════════════════════════════════════════════════════════════
   PARTIDA
   ══════════════════════════════════════════════════════════════ */
carregar();
document.documentElement.setAttribute('data-tema', S.tema === 'claro' ? 'claro' : 'escuro');
document.getElementById('verRod').textContent = 'v' + VERSAO + ' · ' + DATA_VERSAO;
relogio(); setInterval(relogio, 1000);
setInterval(function(){ if(VIEW === 'painel' && !document.getElementById('scrim').classList.contains('on')) pintar(); }, 60000);
pintar();
})();
</script>

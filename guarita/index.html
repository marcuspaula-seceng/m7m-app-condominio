<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --ground:#0C1116;
  --surface:#141A21;
  --surface-2:#1D242C;
  --surface-3:#242D36;
  --line:#28313A;
  --line-soft:#1F272F;
  --ink:#F7F4EC;
  --ink-2:#B8BDC3;
  --ink-3:#7F878F;
  --ink-4:#5A636C;
  --gold:#C2A468;
  --gold-lt:#E0CB9A;
  --gold-dk:#967F4E;
  --gold-dkr:#6D5C3A;
  --pos:#3FB87A;
  --warn:#D4A04A;
  --neg:#DC6363;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
html[data-tema="claro"]{
  color-scheme:light;
  --ground:#F4F1EB; --surface:#FFFFFF; --surface-2:#EDE9E0; --surface-3:#E3DED2;
  --line:#D8D2C4; --line-soft:#E7E2D7;
  --ink:#191E25; --ink-2:#4C555F; --ink-3:#7C8792; --ink-4:#A6AEB8;
  --gold:#9C7C31; --gold-lt:#C4A55F; --gold-dk:#7C6224; --gold-dkr:#DCCFA8;
  --pos:#2E8B57; --warn:#B07A16; --neg:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--gold-lt);text-decoration:none}

/* ── esqueleto ───────────────────────────────────────── */
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.marca{padding:16px 18px 14px;border-bottom:1px solid var(--line-soft)}
.marca .n{font-family:var(--serif);font-size:21px;letter-spacing:.06em;color:var(--gold)}
.marca .s{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.menu{flex:1;overflow-y:auto;padding:10px 8px}
.menu .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink-2);position:relative}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--surface-3);color:var(--ink)}
.nav.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--gold)}
.nav .ic{width:20px;text-align:center;font-size:15px;opacity:.9}
.nav .kb{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.nav .bd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--gold-dkr);color:var(--ink);border-radius:20px;padding:1px 7px}
.nav .bd.al{background:var(--neg);color:#fff}
.rodape{padding:10px 12px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-4);display:flex;gap:8px;align-items:center;justify-content:space-between}
.rodape button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink-3);padding:3px 8px;cursor:pointer;font-size:11px}

.main{display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.top .tit{font-family:var(--serif);font-size:19px}
.top .sub{font-size:12px;color:var(--ink-3)}
.relogio{margin-left:auto;text-align:right;line-height:1.15}
.relogio .h{font-family:var(--mono);font-size:26px;letter-spacing:.02em}
.relogio .d{font-size:11px;color:var(--ink-3);text-transform:capitalize}
.turno-chip{display:flex;flex-direction:column;padding:4px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.turno-chip .a{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}
.turno-chip .b{font-size:13px}
.btn-sos{background:var(--neg);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;letter-spacing:.06em;cursor:pointer;box-shadow:0 0 0 0 rgba(220,99,99,.6);animation:pulso 2.6s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(220,99,99,.45)}70%{box-shadow:0 0 0 12px rgba(220,99,99,0)}100%{box-shadow:0 0 0 0 rgba(220,99,99,0)}}
@media (prefers-reduced-motion:reduce){.btn-sos{animation:none}}
.corpo{flex:1;overflow-y:auto;padding:18px 20px 40px}

/* ── blocos ──────────────────────────────────────────── */
.faixa{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);margin-bottom:14px;font-size:13px}
.faixa.av{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.faixa.pg{border-color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,var(--surface))}
.faixa .esp{margin-left:auto}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.cartao > h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line-soft);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:8px}
.cartao > h3 .esp{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-4)}
.cartao .cnt{padding:14px}
.cartao .cnt.rente{padding:0}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4,.g3,.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.kpi:hover{border-color:var(--gold-dk)}
.kpi .r{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4)}
.kpi .v{font-family:var(--mono);font-size:30px;line-height:1.1;margin-top:4px}
.kpi .o{font-size:11px;color:var(--ink-3)}
.kpi.al{border-color:var(--neg)} .kpi.al .v{color:var(--neg)}
.kpi.at{border-color:var(--warn)} .kpi.at .v{color:var(--warn)}

.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line)}
.tb td{padding:9px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tbody tr:hover{background:var(--surface-2)}
.tb .num{font-family:var(--mono)}
.vazio{padding:26px 14px;text-align:center;color:var(--ink-4);font-size:13px}

.et{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.et.ok{border-color:var(--pos);color:var(--pos)}
.et.at{border-color:var(--warn);color:var(--warn)}
.et.ng{border-color:var(--neg);color:var(--neg)}
.et.gd{border-color:var(--gold-dk);color:var(--gold-lt)}

.b{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.b:hover{border-color:var(--gold-dk)}
.b.p{background:var(--gold);border-color:var(--gold);color:#14100A;font-weight:600}
.b.p:hover{background:var(--gold-lt)}
.b.d{background:var(--neg);border-color:var(--neg);color:#fff}
.b.s{padding:4px 9px;font-size:12px}
.b:disabled{opacity:.4;cursor:not-allowed}
.linha-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

label.cp{display:block;margin-bottom:10px}
label.cp > span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
textarea{min-height:78px;resize:vertical}
.dica{font-size:11px;color:var(--ink-4);margin-top:3px}

.pill{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0}
.mono{font-family:var(--mono)}
.mut{color:var(--ink-3)}
.peq{font-size:12px}
.dir{text-align:right}

/* ── quadro de chaves ────────────────────────────────── */
.quadro{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.gancho{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;position:relative}
.gancho:hover{border-color:var(--gold-dk)}
.gancho .g{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.gancho .c{font-family:var(--mono);font-size:15px;color:var(--gold-lt)}
.gancho .d{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gancho.fora{background:color-mix(in srgb,var(--neg) 14%,var(--surface));border-color:var(--neg)}
.gancho.fora .c{color:var(--neg)}
.gancho .q{font-size:11px;color:var(--neg);margin-top:3px}

/* ── modal ───────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(4,7,10,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.scrim.on{display:flex}
.folha{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.folha.larga{width:min(1080px,100%)}
.folha .fh{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.folha .fh h4{margin:0;font-family:var(--serif);font-size:18px;font-weight:500}
.folha .fh .s{font-size:12px;color:var(--ink-3)}
.folha .fh .x{margin-left:auto;background:none;border:0;color:var(--ink-3);font-size:18px;cursor:pointer;padding:2px 6px}
.folha .fb{padding:16px 18px;overflow-y:auto}
.folha .ff{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}
.torrada{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);border-radius:9px;padding:10px 18px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.torrada.on{opacity:1}
.torrada.ok{border-color:var(--pos)} .torrada.ng{border-color:var(--neg)}

/* ── passos de emergência ────────────────────────────── */
.passo{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--surface-2);cursor:pointer}
.passo:hover{border-color:var(--gold-dk)}
.passo.feito{background:color-mix(in srgb,var(--pos) 12%,var(--surface));border-color:var(--pos)}
.passo .n{font-family:var(--mono);width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px}
.passo.feito .n{background:var(--pos);border-color:var(--pos);color:#08130C}
.passo .t{flex:1}
.passo .hr{font-family:var(--mono);font-size:12px;color:var(--pos)}
.nunca{border-left:3px solid var(--neg);padding:8px 12px;background:color-mix(in srgb,var(--neg) 8%,transparent);border-radius:0 6px 6px 0;font-size:13px;margin-top:10px}
.cen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;width:100%}
.cen:hover{border-color:var(--neg)}
.cen .e{font-size:22px}
.cen .n{font-family:var(--serif);font-size:16px;margin-top:6px}
.cen .q{font-size:12px;color:var(--ink-3);margin-top:3px}

/* ── ícones, avatares e imagem de câmera ─────────────── */
.svgi{display:block;flex:none}
.nav .ic{display:flex;align-items:center;justify-content:center;width:20px;color:var(--ink-3)}
.nav.on .ic,.nav:hover .ic{color:var(--gold)}
.avt{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  color:#fff;font-weight:600;letter-spacing:.02em;flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pess{display:flex;align-items:center;gap:10px}
.mural{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cam{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:#0a0d11;cursor:pointer;line-height:0}
.cam:hover{border-color:var(--gold-dk)}
.cam.ruim{border-color:var(--neg)}
.cam canvas{width:100%;height:auto;display:block}
.camrot{line-height:1.35;padding:7px 9px;font-size:12px;color:var(--ink-2);
  background:var(--surface);border-top:1px solid var(--line-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camgr{border-radius:9px;overflow:hidden;border:1px solid var(--line);line-height:0}
.camgr canvas{width:100%;height:auto;display:block}

@media print{
  .side,.top,.linha-b,.noprint{display:none!important}
  .app{display:block;height:auto}.corpo{overflow:visible;padding:0}
  body{background:#fff;color:#000}
  .cartao{border-color:#bbb;break-inside:avoid}
}
</style>
</head>

/* ── avatar com as iniciais ──────────────────────────── */
function matiz(str){ var h = 0; str = String(str||'?');
  for(var i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 360; return h; }
function iniciais(nome){
  var p = String(nome||'?').replace(/[^\wÀ-ÿ ]/g,' ').trim().split(/\s+/);
  return ((p[0]||'?')[0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase();
}
function avatar(nome, tam){
  var h = matiz(nome), t = tam || 34;
  return '<span class="avt" style="width:'+t+'px;height:'+t+'px;font-size:'+Math.round(t*0.38)+'px;' +
    'background:linear-gradient(145deg,hsl('+h+' 42% 34%),hsl('+((h+38)%360)+' 38% 22%))">' +
    esc(iniciais(nome)) + '</span>';
}
function comAvatar(nome, sub, tam){
  return '<div class="pess">' + avatar(nome, tam) + '<div><strong>' + esc(nome) + '</strong>' +
    (sub ? '<div class="peq mut">' + esc(sub) + '</div>' : '') + '</div></div>';
}

function cenaDe(cam){
  var id = cam.id, z = cam.z;
  if(id === 'C02') return 'recepcao';
  if(id === 'C04' || id === 'C16') return 'salao';
  if(z === 'Acessos') return id === 'C03' ? 'garagem' : 'portaria';
  if(z === 'Perímetro') return 'exterior';
  if(z === 'Estacionamento') return 'garagem';
  if(z === 'Térreo' || z === '1º andar') return 'corredor';
  if(z === 'Convivência') return 'gourmet';
  if(z === 'Piscina') return 'piscina';
  if(z === 'Academia') return 'academia';
  if(z === 'Serviços') return 'servicos';
  if(z === 'Comercial') return 'mercado';
  return 'corredor';
}

function _pessoa(ctx, x, chao, alt, cor){
  ctx.fillStyle = cor;
  ctx.beginPath(); ctx.arc(x, chao - alt, alt*0.13, 0, 6.3); ctx.fill();
  ctx.fillRect(x - alt*0.11, chao - alt*0.84, alt*0.22, alt*0.46);
  ctx.fillRect(x - alt*0.10, chao - alt*0.40, alt*0.08, alt*0.40);
  ctx.fillRect(x + alt*0.02, chao - alt*0.40, alt*0.08, alt*0.40);
}
function _carro(ctx, x, y, larg, cor, farol){
  var a = larg*0.34;
  ctx.fillStyle = cor;
  ctx.fillRect(x, y - a, larg, a);
  ctx.fillRect(x + larg*0.22, y - a*1.7, larg*0.56, a*0.7);
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.arc(x + larg*0.24, y, a*0.26, 0, 6.3); ctx.fill();
  ctx.beginPath(); ctx.arc(x + larg*0.76, y, a*0.26, 0, 6.3); ctx.fill();
  if(farol){
    ctx.fillStyle = 'rgba(255,238,190,.5)';
    ctx.beginPath(); ctx.moveTo(x + larg, y - a*0.7);
    ctx.lineTo(x + larg + 46, y - a*1.6); ctx.lineTo(x + larg + 46, y + 6); ctx.closePath(); ctx.fill();
  }
}

function desenharCena(ctx, tipo, t, W, H){
  var p = PAL[tipo] || PAL.corredor, chao = H*0.78;
  ctx.fillStyle = p[0]; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = p[2]; ctx.fillRect(0, H*0.18, W, chao - H*0.18);
  ctx.fillStyle = p[1]; ctx.fillRect(0, chao, W, H - chao);

  if(tipo === 'portaria' || tipo === 'exterior'){
    ctx.fillStyle = p[1]; ctx.fillRect(0, chao - 2, W, 3);
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 2;
    for(var g = 0; g < 9; g++){
      ctx.beginPath(); ctx.moveTo(W*0.12 + g*W*0.032, H*0.30);
      ctx.lineTo(W*0.12 + g*W*0.032, chao); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,238,190,.10)';
    ctx.beginPath(); ctx.moveTo(W*0.72, H*0.10); ctx.lineTo(W*0.95, chao);
    ctx.lineTo(W*0.45, chao); ctx.closePath(); ctx.fill();
    _pessoa(ctx, W*0.30 + Math.sin(t/1400)*W*0.16, chao, H*0.30, '#7f8b96');
    if(tipo === 'exterior') _carro(ctx, W*0.55 + Math.sin(t/2600)*W*0.12, chao, W*0.26, '#3a444e', true);
  }
  else if(tipo === 'garagem'){
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 2;
    for(var v = 0; v < 5; v++){
      ctx.beginPath(); ctx.moveTo(v*W*0.24 + 8, chao*0.52);
      ctx.lineTo(v*W*0.24 - 10, H); ctx.stroke();
    }
    _carro(ctx, W*0.06, chao, W*0.22, '#39434d', false);
    _carro(ctx, W*0.36, chao, W*0.22, '#4a4038', false);
    _carro(ctx, W*0.66 + Math.sin(t/3000)*10, chao, W*0.22, '#2f3a44', true);
    ctx.fillStyle = 'rgba(194,164,104,.45)';
    ctx.fillRect(W*0.02, chao*0.45, W*0.30, 3);
  }
  else if(tipo === 'corredor'){
    ctx.fillStyle = p[1];
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W*0.30, chao*0.62);
    ctx.lineTo(W*0.70, chao*0.62); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    for(var d = 0; d < 3; d++){
      ctx.fillRect(W*(0.08 + d*0.10), chao*0.60 - d*4, W*0.05, H*0.30 + d*8);
      ctx.fillRect(W*(0.86 - d*0.10), chao*0.60 - d*4, W*0.05, H*0.30 + d*8);
    }
    ctx.fillStyle = 'rgba(255,240,200,.13)';
    for(var l = 0; l < 3; l++) ctx.fillRect(W*0.44, H*0.16 + l*H*0.13, W*0.12, 4);
    _pessoa(ctx, W*0.50 + Math.sin(t/1800)*W*0.10, chao*0.96, H*0.26, '#8c97a1');
  }
  else if(tipo === 'salao' || tipo === 'recepcao'){
    ctx.fillStyle = 'rgba(0,0,0,.30)'; ctx.fillRect(W*0.06, chao*0.66, W*0.40, H*0.16);
    ctx.fillStyle = p[3]; ctx.fillRect(W*0.06, chao*0.66, W*0.40, 4);
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(W*0.60, H*0.20, W*0.32, H*0.42);
    _pessoa(ctx, W*0.24, chao, H*0.30, '#94a0aa');
    if(tipo === 'recepcao') _pessoa(ctx, W*0.68 + Math.sin(t/2200)*W*0.05, chao, H*0.30, '#7e8a95');
  }
  else if(tipo === 'piscina'){
    ctx.fillStyle = '#16394a'; ctx.fillRect(W*0.10, chao*0.52, W*0.80, H*0.42);
    ctx.strokeStyle = 'rgba(150,220,235,.30)'; ctx.lineWidth = 2;
    for(var o = 0; o < 6; o++){
      ctx.beginPath();
      for(var x2 = W*0.10; x2 < W*0.90; x2 += 6){
        var y2 = chao*0.58 + o*H*0.06 + Math.sin((x2 + t/26 + o*20)/22)*2.4;
        if(x2 === W*0.10) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
      }
      ctx.stroke();
    }
    ctx.fillStyle = '#3c4650';
    ctx.fillRect(W*0.04, chao*0.80, W*0.05, H*0.10); ctx.fillRect(W*0.91, chao*0.80, W*0.05, H*0.10);
  }
  else if(tipo === 'academia'){
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    ctx.fillRect(W*0.08, chao*0.60, W*0.16, H*0.26);
    ctx.fillRect(W*0.40, chao*0.66, W*0.14, H*0.20);
    ctx.fillStyle = p[3];
    ctx.fillRect(W*0.08, chao*0.60, W*0.16, 3);
    _pessoa(ctx, W*0.46, chao, H*0.28 + Math.sin(t/500)*2, '#9aa6b0');
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(W*0.66, H*0.22, W*0.28, H*0.40);
  }
  else if(tipo === 'servicos'){
    for(var m = 0; m < 4; m++){
      ctx.fillStyle = 'rgba(255,255,255,.07)';
      ctx.fillRect(W*(0.06 + m*0.23), chao*0.52, W*0.18, H*0.38);
      ctx.strokeStyle = 'rgba(190,205,215,.35)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(W*(0.15 + m*0.23), chao*0.72, H*0.10, 0, 6.3); ctx.stroke();
      ctx.save();
      ctx.translate(W*(0.15 + m*0.23), chao*0.72); ctx.rotate(t/(700 + m*180));
      ctx.strokeStyle = 'rgba(190,205,215,.22)';
      ctx.beginPath(); ctx.moveTo(-H*0.08, 0); ctx.lineTo(H*0.08, 0); ctx.stroke();
      ctx.restore();
    }
  }
  else if(tipo === 'gourmet' || tipo === 'mercado'){
    ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.fillRect(W*0.14, chao*0.70, W*0.52, H*0.10);
    ctx.fillStyle = p[3]; ctx.fillRect(W*0.14, chao*0.70, W*0.52, 3);
    for(var b = 0; b < 4; b++){
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      ctx.fillRect(W*(0.18 + b*0.13), chao*0.80, W*0.05, H*0.12);
    }
    if(tipo === 'mercado'){
      ctx.fillStyle = 'rgba(255,255,255,.06)';
      for(var p2 = 0; p2 < 3; p2++) ctx.fillRect(W*0.70, H*0.24 + p2*H*0.14, W*0.24, H*0.09);
    } else {
      ctx.fillStyle = 'rgba(255,170,80,' + (0.28 + Math.sin(t/300)*0.10) + ')';
      ctx.fillRect(W*0.72, chao*0.62, W*0.18, H*0.14);
    }
    _pessoa(ctx, W*0.40 + Math.sin(t/2400)*W*0.06, chao, H*0.28, '#8d98a3');
  }

  /* vinheta e linhas de varredura, para parecer imagem de CFTV */
  var g2 = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.95);
  g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.022)';
  for(var s = 0; s < H; s += 3) ctx.fillRect(0, s, W, 1);
}

function ruido(ctx, W, H, forca){
  var n = Math.round(W*H*0.05);
  ctx.fillStyle = 'rgba(255,255,255,' + forca + ')';
  for(var i = 0; i < n; i++)
    ctx.fillRect((Math.random()*W)|0, (Math.random()*H)|0, 1, 1);
}

function pintarCam(cv, cam, t){
  var ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  if(cam.st === 'off'){
    ctx.fillStyle = '#0a0d11'; ctx.fillRect(0, 0, W, H);
    ruido(ctx, W, H, 0.22);
    ctx.fillStyle = 'rgba(220,99,99,.92)';
    ctx.font = '600 ' + Math.round(H*0.11) + 'px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SEM SINAL', W/2, H/2 + H*0.04);
    ctx.textAlign = 'left';
  } else {
    desenharCena(ctx, cenaDe(cam), t, W, H);
    if(cam.st === 'deg'){
      ctx.fillStyle = 'rgba(120,130,140,.28)'; ctx.fillRect(0, 0, W, H);
      ruido(ctx, W, H, 0.10);
    }
  }
  /* selo: código, hora e o ponto de gravação */
  var d = new Date();
  ctx.font = '600 ' + Math.max(9, Math.round(H*0.075)) + 'px ui-monospace,Consolas,monospace';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H*0.13);
  ctx.fillStyle = 'rgba(255,255,255,.82)';
  ctx.fillText(cam.id + '  ' + cam.nm.slice(0, 22), 6, H*0.095);
  ctx.textAlign = 'right';
  ctx.fillText(pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()), W - 6, H*0.095);
  ctx.textAlign = 'left';
  if(cam.st !== 'off' && (d.getSeconds() % 2 === 0)){
    ctx.fillStyle = '#dc6363';
    ctx.beginPath(); ctx.arc(W - 8, H - 10, 3.4, 0, 6.3); ctx.fill();
  }
}

/* ── laço de animação, só do que está na tela ────────── */
var _cvs = [], _laco = null;
function ligarCanvas(){
  _cvs = [];
  var lista = document.querySelectorAll('canvas[data-cv]');
  for(var i = 0; i < lista.length; i++){
    var cv = lista[i], id = cv.getAttribute('data-cv'), cam = null;
    S.cameras.forEach(function(c){ if(c.id === id) cam = c; });
    if(!cam) continue;
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(120, Math.round(r.width || cv.clientWidth || 240));
    cv.height = Math.round(cv.width * 0.5625);
    _cvs.push({ cv:cv, cam:cam });
  }
  if(!_laco && _cvs.length) _laco = requestAnimationFrame(quadro);
}
function quadro(t){
  for(var i = 0; i < _cvs.length; i++) pintarCam(_cvs[i].cv, _cvs[i].cam, t);
  _laco = _cvs.length ? requestAnimationFrame(quadro) : null;
}
function telaCam(cam, alt){
  return '<div class="cam' + (cam.st !== 'on' ? ' ruim' : '') + '" data-cam="' + cam.id + '">' +
    '<canvas data-cv="' + cam.id + '"></canvas>' +
    '<div class="camrot"><span class="mono">' + esc(cam.id) + '</span> ' + esc(cam.nm) +
    (cam.st === 'off' ? ' <span class="et ng">fora</span>' : cam.st === 'deg' ? ' <span class="et at">ruim</span>' : '') +
    '</div></div>';
}
function muralCameras(ids){
  var sel = [];
  S.cameras.forEach(function(c){ if(ids.indexOf(c.id) >= 0) sel.push(c); });
  return '<div class="mural">' + sel.map(function(c){ return telaCam(c); }).join('') + '</div>';
}

/* ── formatação ─────────────────────────────────────── */
function pad2(n){ return (n<10?'0':'')+n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dt(iso){ if(!iso) return '—'; var d = new Date(iso);
  return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function hm(iso){ if(!iso) return '—'; var d = new Date(iso); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function dia(iso){ var d = iso ? new Date(iso) : new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function mes(iso){ return dia(iso).slice(0,7); }
function decorrido(iso){
  if(!iso) return '—';
  var m = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  if(m < 60) return m+' min';
  var h = Math.floor(m/60);
  if(h < 24) return h+'h'+pad2(m%60);
  return Math.floor(h/24)+'d '+(h%24)+'h';
}
function brl(v){ return 'R$ ' + (Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function brl0(v){ return 'R$ ' + Math.round(v).toLocaleString('pt-BR'); }
function guarda(){ return S.turno ? S.turno.guarda : 'sem turno aberto'; }
function un(cod){ for(var i=0;i<S.unidades.length;i++){ if(S.unidades[i].cod===cod) return S.unidades[i]; } return null; }

/* campos: {id, rot, tipo:'texto|num|sel|area|data|hora|tel', opts:[], val, dica, largo} */
function campos(cs){
  return '<div class="grade g2">' + cs.map(function(c){
    var w = c.largo ? ' style="grid-column:1/-1"' : '';
    var v = esc(c.val==null?'':c.val), i;
    if(c.tipo === 'sel'){
      var ops = (c.opts || []).slice(), achou = false;
      ops.forEach(function(o){
        var val = (typeof o === 'object') ? o.v : o;
        if(String(val) === String(c.val)) achou = true;
      });
      /* se o valor atual não estiver na lista, ele entra — senão o navegador
         seleciona a primeira opção e o registro muda de categoria sozinho */
      if(!achou && c.val) ops.unshift(c.val);
      i = '<select id="c_'+c.id+'">' + ops.map(function(o){
        var t = (typeof o === 'object') ? o.t : o, val = (typeof o === 'object') ? o.v : o;
        return '<option value="'+esc(val)+'"'+(String(val)===String(c.val)?' selected':'')+'>'+esc(t)+'</option>'; }).join('') + '</select>';
    }
    else if(c.tipo === 'area') i = '<textarea id="c_'+c.id+'">'+v+'</textarea>';
    else i = '<input type="'+(c.tipo==='num'?'number':c.tipo==='data'?'date':c.tipo==='hora'?'time':'text')+
      '" id="c_'+c.id+'" value="'+v+'"'+(c.tipo==='num'?' step="0.01"':'')+(c.ph?' placeholder="'+esc(c.ph)+'"':'')+'>';
    return '<label class="cp"'+w+'><span>'+esc(c.rot)+'</span>'+i+
      (c.dica?'<span class="dica">'+esc(c.dica)+'</span>':'')+'</label>';
  }).join('') + '</div>';
}
function ler(id){ var e = document.getElementById('c_'+id); return e ? e.value.trim() : ''; }
function lerNum(id){ var v = parseFloat(ler(id).replace(',','.')); return isNaN(v) ? 0 : v; }

/* Cada item do menu mostra um número. O que é pendência fica vermelho;
   o resto é só o tamanho do cadastro, para nada aparecer vazio. */
function contadores(){
  var c = {}, hoje = dia();
  var dentro = S.acessos.filter(function(a){ return !a.saida; }).length;
  var pend = S.encomendas.filter(function(e){ return !e.retiradoEm; }).length;
  var fora = S.chaves.filter(function(k){ return k.estado !== 'no quadro'; }).length;
  var graves = S.ocorrencias.filter(function(o){ return !o.fechada && o.grav === 'Grave'; }).length;
  var off = S.cameras.filter(function(x){ return x.st !== 'on'; }).length;
  var emAberto = S.emergencias.filter(function(e){ return !e.fim; }).length;
  var rondasHoje = S.rondas.filter(function(r){ return dia(r.inicio) === hoje; }).length;
  var atend = S.atendimentos.filter(function(a){ return a.status !== 'Resolvido'; }).length;
  var semConf = S.contatos.filter(function(x){ return !x.verificadoEm; }).length;
  var vendasHoje = S.vendas.filter(function(v){ return dia(v.quando) === hoje; }).length;

  var credAtivas = S.credenciais.filter(function(c2){ return c2.estado === 'Ativo'; }).length;
  var negadasHoje = S.leituras.filter(function(l){
    return dia(l.quando) === hoje && l.resultado === 'Negada'; }).length;
  var cartas = S.correspondencia.filter(function(c2){ return !c2.retiradoEm; }).length;
  var canaisVazios = 0;
  S.maquinas.forEach(function(m){ m.canais.forEach(function(x){ if(x.atual === 0) canaisVazios++; }); });
  var gouAbertas = S.gourmet.filter(function(g){ return g.estado !== 'Devolvida'; }).length;

  c.credenciais = { n:credAtivas, al:negadasHoje > 0 };
  c.coworking   = { n:S.reservasCw.filter(function(r){ return r.dia === hoje; }).length || S.cafeteria.length };
  c.vending     = { n:canaisVazios || S.maquinas.length, al:canaisVazios > 0 };
  c.areas       = { n:gouAbertas || S.gourmet.length };
  c.painel      = { n:eventos().filter(function(e){ return dia(e.q) === hoje; }).length };
  c.acessos    = { n:dentro, al:dentro > 8 };
  c.encomendas = { n:pend + cartas };
  c.chaves     = { n:fora, al:fora > 3 };
  c.rondas     = { n:rondasHoje + '/' + HORARIOS_RONDA.length, al:rondasHoje === 0 };
  c.cameras    = { n:off || S.cameras.length, al:off > 2 };
  c.recepcao   = { n:atend, al:atend > 4 };
  c.alunos     = { n:S.unidades.length };
  c.telefones  = { n:S.contatos.length, al:semConf > 6 };
  c.emergencia = { n:emAberto || POPS.length, al:emAberto > 0 };
  c.ocorrencias= { n:graves || S.ocorrencias.length, al:graves > 0 };
  c.caixa      = { n:vendasHoje || S.vendas.length };
  c.auditoria  = { n:S.lancamentos.length };
  c.turno      = { n:S.turno ? 'aberto' : 'fechado', al:!S.turno };
  c.manual     = { n:MANUAL.length };
  c.dados      = { n:S.unidades.length + S.acessos.length + S.ocorrencias.length + S.lancamentos.length };
  return c;
}

function eventos(){
  var e = [];
  S.acessos.forEach(function(a){
    e.push({ q:a.entrada, ic:'⇢', t:'Entrada · '+a.nome, s:a.tipo+(a.unidade?' → '+a.unidade:'') });
    if(a.saida) e.push({ q:a.saida, ic:'⇠', t:'Saída · '+a.nome, s:'permaneceu '+a.permanencia });
  });
  S.encomendas.forEach(function(x){
    e.push({ q:x.recebidoEm, ic:'✉', t:'Encomenda recebida · '+x.unidade, s:x.transportadora });
    if(x.retiradoEm) e.push({ q:x.retiradoEm, ic:'✔', t:'Encomenda retirada · '+x.unidade, s:x.retiradoPor });
  });
  S.chavesHist.forEach(function(h){
    e.push({ q:h.retirada, ic:'⚿', t:'Chave '+h.cod+' retirada', s:h.quem });
    if(h.devolucao) e.push({ q:h.devolucao, ic:'⚿', t:'Chave '+h.cod+' devolvida', s:h.quem });
  });
  S.ocorrencias.forEach(function(o){ e.push({ q:o.quando, ic:o.grav==='Grave'?'⚠':'▤', t:o.titulo, s:o.tipo }); });
  S.rondas.forEach(function(r){ e.push({ q:r.inicio, ic:'◷', t:'Ronda iniciada', s:r.por }); });
  S.vendas.forEach(function(v){ e.push({ q:v.quando, ic:'▣', t:'Venda · '+v.item, s:brl(v.total) }); });
  S.atendimentos.forEach(function(a){ e.push({ q:a.quando, ic:'☏', t:'Atendimento · '+a.tipo, s:a.solicitante }); });
  return e.filter(function(x){ return x.q; }).sort(function(a,b){ return a.q < b.q ? 1 : -1; });
}

  var prev = HORARIOS_RONDA.map(function(h){
    var r = feitas[h];

    return '<button class="kpi '+(r?'':(atrasada?'al':''))+'" data-ronda="'+h+'">' +
      '<div class="r">'+h+'</div><div class="v" style="font-size:20px">' +
      (r ? '✔' : (atrasada ? 'atrasada' : 'prevista')) + '</div>' +
      '<div class="o">'+(r ? r.por + ' · ' + hm(r.inicio) : 'clique para iniciar')+'</div></button>';

    var n = Object.keys(r.pontos||{}).length;

      '<td>'+esc(r.por)+'</td><td class="num">'+n+'/'+PONTOS.length+'</td>' +
      '<td>'+(r.fim?decorrido(r.inicio)===''?'':hm(r.fim):'<span class="et at">em curso</span>')+'</td>' +
      '<td class="peq">'+esc(r.obs||'')+'</td></tr>';
  });
  return avisoTurno() +
    '<div class="linha-b" style="margin-bottom:14px"><button class="b p" data-act="novaRonda">Iniciar ronda extra</button></div>' +
    cartao('Rondas de hoje', '<div class="grade g6">'+prev+'</div>',
      esc(hoje.length + ' de ' + HORARIOS_RONDA.length + ' feitas')) +
    cartao('Histórico', tabela([{t:'Início'},{t:'Horário'},{t:'Guarda'},{t:'Pontos'},{t:'Fim'},{t:'Observação'}],
      hist, 'Nenhuma ronda registrada.'), '', true);
}
function novaRonda(horario){
  var r = { id:uid('rd'), inicio:agora(), horario:(typeof horario === 'string' ? horario : ''), por:guarda(),
    pontos:{}, obs:'', fim:null };
  S.rondas.unshift(r); gravar(); rondaAberta(r.id);
}
/* A ronda aberta fica guardada aqui. O clique nos pontos é tratado pelo
   delegador único de _p8-manual.js — antes cada abertura registrava um
   listener novo em #fBody, e o listener velho continuava vivo marcando
   pontos da ronda anterior. */
var RONDA_ABERTA = null;
function pontosHTML(r){
  return PONTOS.map(function(p,i){
    var f = r.pontos[i];
    return '<div class="passo'+(f?' feito':'')+'" data-ponto="'+i+'">' +
      '<div class="n">'+(i+1)+'</div><div class="t">'+esc(p)+'</div>' +
      '<div class="hr">'+(f?hm(f):'')+'</div></div>';
  }).join('');
}
function marcarPonto(i){
  var r = null;
  S.rondas.forEach(function(x){ if(x.id === RONDA_ABERTA) r = x; });
  if(!r) return;
  if(r.pontos[i]) delete r.pontos[i]; else r.pontos[i] = agora();
  gravar();
  var alvo = document.getElementById('pontos');
  if(alvo) alvo.innerHTML = pontosHTML(r);
}
function rondaAberta(id){
  var r = null; S.rondas.forEach(function(x){ if(x.id === id) r = x; });
  if(!r) return;
  RONDA_ABERTA = id;
  folha('Ronda ' + (r.horario || 'extra'), 'Iniciada às ' + hm(r.inicio) + ' por ' + r.por,
    '<p class="peq mut">Marque cada ponto no momento em que você estiver nele. A hora é gravada sozinha.</p>' +
    '<div id="pontos">' + pontosHTML(r) + '</div>' +
    campos([{ id:'obs', rot:'O que você viu de diferente', tipo:'area', largo:true, val:r.obs }]),
    [ { txt:'Continuar depois', fn:function(){ r.obs = ler('obs'); gravar(); RONDA_ABERTA = null; fechar(); pintar(); } },
      { txt:'Encerrar ronda', cls:'p', fn:function(){
        r.obs = ler('obs'); r.fim = agora(); RONDA_ABERTA = null; gravar(); fechar(); pintar();
        var n = Object.keys(r.pontos).length;
        if(r.obs) registrar('Ronda','Informação','Ronda '+(r.horario||'extra')+' com observação', r.obs, true);
        torrada('Ronda encerrada', n+' de '+PONTOS.length+' pontos', n===PONTOS.length?'ok':'');
      } } ], true);
}

/* Mesma correção da ronda: o passo marcado é tratado pelo delegador único,
   senão o listener da emergência anterior continua vivo e apaga a hora dela. */
var POP_ABERTO = null;
function passosHTML(p, e){
  return p.passos.map(function(t,i){
    var f = e.passos[i];
    return '<div class="passo'+(f?' feito':'')+'" data-pp="'+i+'"><div class="n">'+(i+1)+'</div>' +
      '<div class="t">'+esc(t)+'</div><div class="hr">'+(f?hm(f):'')+'</div></div>';
  }).join('');
}
function marcarPasso(i){
  var e = null, p = null;
  S.emergencias.forEach(function(x){ if(x.id === POP_ABERTO) e = x; });
  if(!e) return;
  POPS.forEach(function(x){ if(x.id === e.pop) p = x; });
  if(!p) return;
  if(e.passos[i]) delete e.passos[i]; else e.passos[i] = agora();
  gravar();
  var alvo = document.getElementById('passosPop');
  if(alvo) alvo.innerHTML = passosHTML(p, e);
}
function abrirPop(id, emgId){
  var p = null; POPS.forEach(function(x){ if(x.id === id) p = x; });
  if(!p) return;
  var e = null;
  if(emgId){ S.emergencias.forEach(function(x){ if(x.id === emgId) e = x; }); }
  if(!e){
    e = { id:uid('em'), cenario:p.nome, pop:p.id, inicio:agora(), por:guarda(), passos:{}, notas:'', fim:null };
    S.emergencias.unshift(e); gravar();
    registrar('Emergência','Grave','Emergência aberta: '+p.nome,'Processo iniciado na guarita.', true);
  }
  POP_ABERTO = e.id;
  folha(p.e + '  ' + p.nome, p.q,
    '<div class="faixa pg">Aberta às '+hm(e.inicio)+' por '+esc(e.por)+' — cada passo grava a hora em que foi feito.</div>' +
    '<div id="passosPop">' + passosHTML(p, e) + '</div>' +
    '<div class="nunca"><strong>Nunca:</strong> ' + p.nunca.map(esc).join(' · ') + '</div>' +
    campos([{ id:'notas', rot:'O que aconteceu, com hora', tipo:'area', largo:true, val:e.notas }]),
    [ { txt:'Sair sem encerrar', fn:function(){ e.notas = ler('notas'); POP_ABERTO = null; gravar(); fechar(); pintar(); } },
      { txt:'Encerrar e lançar no livro', cls:'p', fn:function(){
        e.notas = ler('notas'); e.fim = agora();
        var linha = p.passos.map(function(t,i){
          return (e.passos[i] ? hm(e.passos[i]) : 'não feito') + ' — ' + t; }).join('\n');
        registrar('Emergência','Grave','Encerrada: '+p.nome,
          'Aberta ' + dt(e.inicio) + ', encerrada ' + dt(e.fim) + '.\n\n' + linha +
          (e.notas ? '\n\nRelato: ' + e.notas : ''), true);
        POP_ABERTO = null;
        gravar(); fechar(); pintar(); torrada('Emergência encerrada','Linha do tempo foi para o livro','ok');
      } } ], true);
}

        '<div class="o">'+hoje.length+' vendas</div></div>' +

function fecharCaixa(){
  var t = S.turno;
  /* Tudo que entra no turno passa por S.lancamentos — venda de balcão,
     piscina, gourmet, impressão, cafeteria e vending. Somar só S.vendas
     acusava o guarda de sobra na gaveta. */
  var vs = S.lancamentos.filter(function(l){
    if(l.sentido !== 'entrada') return false;
    return t ? (l.quando >= t.inicio) : (dia(l.quando) === dia());
  });
  var porForma = {};
  vs.forEach(function(v){ porForma[v.forma] = (porForma[v.forma]||0) + v.valor; });
  var total = vs.reduce(function(a,v){ return a + v.valor; }, 0);
  folha('Fechamento de caixa', (t ? 'Turno de ' + t.guarda + ' desde ' + hm(t.inicio) : 'Sem turno aberto — usando o dia'),
    tabela([{t:'Forma'},{t:'Valor',dir:true}], Object.keys(porForma).map(function(k){
      return '<tr><td>'+esc(k)+'</td><td class="dir num">'+brl(porForma[k])+'</td></tr>'; }),
      'Nada vendido neste turno.') +
    '<div class="faixa" style="margin-top:12px">Total do turno: <strong>'+brl(total)+'</strong> em '+vs.length+' vendas</div>' +
    campos([{ id:'contado', rot:'Dinheiro contado na gaveta (R$)', tipo:'num' },
      { id:'obs', rot:'Observação do fechamento', tipo:'area', largo:true }]),
    [ { txt:'Cancelar', fn:fechar },
      { txt:'Registrar fechamento', cls:'p', fn:function(){
        var contado = lerNum('contado'), esperado = porForma['Dinheiro'] || 0;
        var dif = contado - esperado;
        registrar('Caixa', Math.abs(dif) > 0.01 ? 'Atenção' : 'Informação',
          'Fechamento de caixa: ' + brl(total),
          'Esperado em dinheiro ' + brl(esperado) + ', contado ' + brl(contado) +
          ', diferença ' + brl(dif) + '. ' + ler('obs'), true);
        gravar(); fechar(); pintar();
        torrada('Caixa fechado', Math.abs(dif) > 0.01 ? 'Diferença de ' + brl(dif) : 'Bateu certo',
          Math.abs(dif) > 0.01 ? 'ng' : 'ok');
      } } ]);
}

/* ── AUDITORIA ───────────────────────────────────────── */
var ANO_FILTRO = String(new Date().getFullYear());

function v_auditoria(){
  var ano = ANO_FILTRO;
  var doAno = S.lancamentos.filter(function(l){ return dia(l.quando).slice(0,4) === ano; });
  var ent = doAno.filter(function(l){ return l.sentido === 'entrada'; });
  var sai = doAno.filter(function(l){ return l.sentido === 'saida'; });
  var tE = ent.reduce(function(a,l){ return a + l.valor; }, 0);
  var tS = sai.reduce(function(a,l){ return a + l.valor; }, 0);
  var res = tE - tS;
  var semNota = sai.filter(function(l){ return !l.nota; });
  var tSemNota = semNota.reduce(function(a,l){ return a + l.valor; }, 0);

  /* receita potencial dos 19 apartamentos, base 10/08/2026 */
  var potMes = S.unidades.reduce(function(a,u){ return a + PRODUTOS[u.tipo].preco; }, 0);

  var meses = {};
  doAno.forEach(function(l){
    var m = mes(l.quando);
    meses[m] = meses[m] || { e:0, s:0 };
    meses[m][l.sentido === 'entrada' ? 'e' : 's'] += l.valor;
  });
  var linhasMes = Object.keys(meses).sort().reverse().map(function(m){
    var x = meses[m], r = x.e - x.s;
    return '<tr><td class="mono">'+esc(m)+'</td><td class="dir num">'+brl(x.e)+'</td>' +
      '<td class="dir num">'+brl(x.s)+'</td>' +
      '<td class="dir num" style="color:'+(r>=0?'var(--pos)':'var(--neg)')+'">'+brl(r)+'</td></tr>';
  });

  var porCat = {};
  sai.forEach(function(l){ porCat[l.categoria] = (porCat[l.categoria]||0) + l.valor; });
  var linhasCat = Object.keys(porCat).sort(function(a,b){ return porCat[b] - porCat[a]; }).map(function(k){
    var pc = tS ? (porCat[k]/tS*100) : 0;
    return '<tr><td>'+esc(k)+'</td><td class="dir num">'+brl(porCat[k])+'</td>' +
      '<td class="dir num">'+pc.toFixed(1)+'%</td>' +
      '<td><div style="height:6px;border-radius:4px;background:var(--gold);width:'+Math.max(2,pc)+'%"></div></td></tr>';
  });

  var ult = S.lancamentos.slice(0,40).map(function(l){
    return '<tr><td class="num mut">'+dt(l.quando)+'</td>' +
      '<td>'+(l.sentido==='entrada'?'<span class="et ok">entrada</span>':'<span class="et ng">saída</span>')+'</td>' +
      '<td>'+esc(l.categoria)+'<div class="peq mut">'+esc(l.desc)+'</div></td>' +
      '<td>'+esc(l.fornecedor||'—')+'</td><td class="dir num">'+brl(l.valor)+'</td>' +
      '<td>'+esc(l.forma)+'</td>' +
      '<td>'+(l.sentido==='saida' ? (l.nota?'<span class="et ok">com nota</span>':'<span class="et at">sem nota</span>') : '')+'</td>' +
      '<td class="dir"><button class="b s" data-lanc="'+l.id+'">Ver</button></td></tr>';
  });

  var anos = {};
  S.lancamentos.forEach(function(l){ anos[dia(l.quando).slice(0,4)] = 1; });
  anos[String(new Date().getFullYear())] = 1;

  return avisoDemo() + '<div class="linha-b" style="margin-bottom:14px">' +
      '<button class="b p" data-act="novaSaida">Lançar gasto ou compra</button>' +
      '<button class="b" data-act="novaEntrada">Lançar recebimento</button>' +
      '<select id="selAno" style="max-width:140px">' + Object.keys(anos).sort().reverse().map(function(a){
        return '<option'+(a===ano?' selected':'')+'>'+a+'</option>'; }).join('') + '</select>' +
      '<button class="b" onclick="window.print()">Imprimir o ano</button>' +
    '</div>' +
    '<div class="grade g4" style="margin-bottom:14px">' +
      '<div class="kpi"><div class="r">Entrou em '+ano+'</div><div class="v" style="font-size:24px;color:var(--pos)">'+brl0(tE)+'</div><div class="o">'+ent.length+' lançamentos</div></div>' +
      '<div class="kpi"><div class="r">Saiu em '+ano+'</div><div class="v" style="font-size:24px;color:var(--neg)">'+brl0(tS)+'</div><div class="o">'+sai.length+' lançamentos</div></div>' +
      '<div class="kpi'+(res<0?' al':'')+'"><div class="r">Resultado do ano</div><div class="v" style="font-size:24px">'+brl0(res)+'</div>' +
        '<div class="o">'+(res>=0?'ganho':'prejuízo')+' apurado</div></div>' +
      '<div class="kpi'+(tSemNota?' at':'')+'"><div class="r">Gasto sem nota</div><div class="v" style="font-size:24px">'+brl0(tSemNota)+'</div>' +
        '<div class="o">'+semNota.length+' lançamentos sem comprovante</div></div>' +
    '</div>' +
    /* comparação mês a mês: o potencial cheio × os meses já lançados,
       e só contra a receita de aluguel — lavanderia e vending não entram
       nesse potencial, somá-las inflava a perda */
    (function(){
      var nMeses = Object.keys(meses).length || 1;
      var alug = ent.filter(function(l){ return l.categoria === 'Aluguel de unidade'; })
        .reduce(function(a,l){ return a + l.valor; }, 0);
      var pot = potMes * nMeses;
      var falta = pot - alug;
      return '<div class="faixa">∑ Nos <strong>'+nMeses+'</strong> meses lançados, o aluguel das 19 unidades ' +
        'a preço cheio de 10/08/2026 daria <strong>'+brl0(pot)+'</strong>. Entrou <strong>'+brl0(alug)+'</strong>. ' +
        'A diferença de <strong>'+brl0(falta)+'</strong> é vacância, desconto ou inadimplência — ' +
        'lavanderia, vending, coworking e áreas não entram nessa conta, são receita à parte.</div>';
    })() +
    '<div class="grade g2">' +
      cartao('Mês a mês', tabela([{t:'Mês'},{t:'Entrou',dir:true},{t:'Saiu',dir:true},{t:'Resultado',dir:true}],
        linhasMes, 'Nenhum lançamento em ' + ano), '', true) +
      cartao('Para onde foi o dinheiro', tabela([{t:'Categoria'},{t:'Valor',dir:true},{t:'%',dir:true},{t:''}],
        linhasCat, 'Nenhuma saída lançada.'), '', true) +
    '</div>' +
    cartao('Lançamentos',
      tabela([{t:'Quando'},{t:'Sentido'},{t:'Categoria'},{t:'Fornecedor'},{t:'Valor',dir:true},{t:'Forma'},{t:'Nota'},{t:'',dir:true}],
        ult, 'Nada lançado ainda. Todo gasto do condomínio entra aqui — é isso que fecha o ano.'),
      esc(S.lancamentos.length + ' no total'), true);
}

  var c = null; S.credenciais.forEach(function(x){ if(x.num === num) c = x; });

function registrarLeitura(cred, leitor, direcao, forcarNegada){
  var negada = forcarNegada || cred.estado !== 'Ativo' || cred.permissoes.indexOf(leitor) < 0;
  var motivo = !negada ? '' :
    (cred.estado !== 'Ativo' ? 'Credencial ' + cred.estado.toLowerCase()
      : 'Sem permissão para ' + leitor.toLowerCase());
  S.leituras.unshift({ id:uid('lt'), quando:agora(), cred:cred.id, num:cred.num,
    portador:cred.portador, unidade:cred.unidade, leitor:leitor, direcao:direcao,
    resultado: negada ? 'Negada' : 'Liberada', motivo:motivo });
  if(S.leituras.length > 500) S.leituras.length = 500;
  if(negada && cred.estado !== 'Ativo')
    registrar('Acesso','Atenção','Tentativa com credencial ' + cred.estado.toLowerCase(),
      'Cartão ' + cred.num + ' de ' + cred.portador + ' apresentado em ' + leitor + '. Passagem negada.', true);
  gravar();
  return !negada;
}

function v_areas(){
  var mesAt = mes();
  var pisMes = S.piscina.filter(function(p){ return mes(p.quando) === mesAt; });
  var totPis = pisMes.reduce(function(a,p){ return a + p.valor; }, 0);
  var gouMes = S.gourmet.filter(function(g){ return mes(g.quando) === mesAt; });
  var totGou = gouMes.reduce(function(a,g){ return a + g.valor; }, 0);
  var abertas = S.gourmet.filter(function(g){ return g.estado !== 'Devolvida'; });

  /* agenda do gourmet, 14 dias */
  var agenda = [];
  for(var d = 0; d < 14; d++){
    var x = new Date(); x.setDate(x.getDate() + d);

}

    return '<tr><td>'+esc(c[0])+'</td><td class="dir num">'+c[1]+'</td></tr>'; });
  return '<div class="faixa">⛁ Os dados ficam neste computador, dentro do navegador. Nada sai daqui sozinho. ' +
      'Backup é responsabilidade humana: exporte e guarde no NAS.</div>' +
    '<div class="linha-b" style="margin-bottom:14px">' +
      '<button class="b p" data-act="exportar">Exportar backup (.json)</button>' +
      '<input type="file" id="arq" accept="application/json" style="display:none">' +
      '<button class="b" data-act="importar">Importar backup</button>' +
      '<button class="b" data-act="limparDemo">Apagar só os dados de demonstração</button>' +
      '<button class="b" data-act="recarregar">Recarregar os exemplos</button>' +
    '</div>' +
    '<div class="grade g2">' +
      cartao('O que está gravado', tabela([{t:'Registro'},{t:'Quantidade',dir:true}], contas), '', true) +
      cartao('Ficha técnica',
        '<div class="peq">Versão '+VERSAO+' · '+DATA_VERSAO+'<br>' +
        'Chave de gravação: <span class="mono">'+LS+'</span><br>' +
        'Tamanho gravado: <span class="mono">'+(tam/1024).toFixed(1)+' KB</span><br>' +
        'Quantitativo oficial 10/08/2026: '+INVENTARIO.apartamentos+' apartamentos, '+INVENTARIO.leitos+' leitos, ' +
        INVENTARIO.vagas+' vagas, '+INVENTARIO.camerasPrevistas+' câmeras previstas.<br>' +
        'Preços: '+brl0(PRODUTOS.smart.preco)+' Smart · '+brl0(PRODUTOS.plus.preco)+' Plus · '+
        brl0(PRODUTOS.signature.preco)+' Signature (10/08/2026).<br>' +
        'Origem do sistema: app do condomínio M7M, mesma paleta e mesmo padrão técnico.</div>') +
    '</div>';
}
function exportar(){
  var nome = 'm7m-guarita-' + dia() + '.json';
  var blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  torrada('Backup gerado', nome + ' — guarde no NAS', 'ok');
}
function importar(){
  var inp = document.getElementById('arq'); if(!inp) return;
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      var dados;
      try{ dados = JSON.parse(r.result); }
      catch(e){ torrada('Arquivo inválido','Não é um backup deste sistema','ng'); return; }
      if(!dados.unidades){ torrada('Arquivo inválido','Falta o cadastro de unidades','ng'); return; }
      folha('Importar backup', f.name,
        '<div class="faixa pg">Isto substitui tudo que está gravado neste computador pelo conteúdo do arquivo. ' +
        'Se o que está na tela ainda não foi exportado, cancele e exporte primeiro.</div>' +
        '<div class="peq">O arquivo traz: '+ (dados.unidades||[]).length +' unidades, '+
        (dados.acessos||[]).length +' acessos, '+ (dados.ocorrencias||[]).length +' ocorrências, '+
        (dados.lancamentos||[]).length +' lançamentos.</div>',
        [ { txt:'Cancelar', fn:fechar },
          { txt:'Exportar o atual antes', fn:function(){ exportar(); } },
          { txt:'Substituir agora', cls:'d', fn:function(){
            S = dados; gravar(); fechar(); pintar(); torrada('Backup importado','','ok'); } } ]);
    };
    r.readAsText(f);
  };
  inp.click();
}
function limparDemo(){
  var demo = S.unidades.filter(function(u){ return u.demo; }).length;
  folha('Apagar dados de demonstração', 'Só o que foi criado como exemplo',
    '<div class="faixa av">Vai apagar, nas ' + demo + ' unidades ainda marcadas como demonstração: ' +
    'nome do aluno, telefone, curso, responsável, ficha de saúde, autorizados, veículos, restrições e observação. ' +
    'Também apaga as credenciais fictícias e as passagens delas no log.</div>' +
    '<p class="peq mut">Continuam: os 19 apartamentos, o quadro de chaves, os telefones, e todo o movimento — ' +
    'acessos, ocorrências, rondas, caixa e auditoria.</p>',
    [ { txt:'Cancelar', fn:fechar },
      { txt:'Exportar backup antes', fn:function(){ exportar(); } },
      { txt:'Apagar os nomes fictícios', cls:'d', fn:function(){
        var cred = 0;
        S.unidades.forEach(function(u){
          if(u.demo){
            u.aluno = ''; u.tel = ''; u.curso = '';
            u.resp = [{ nome:'', rel:'', tel:'', acessoPais:false, codigo:u.resp[0] ? u.resp[0].codigo : '' }];
            u.saude = { sangue:'', alergia:'', condicao:'', remedio:'', plano:'' };
            /* autorizado e restrição fictícios não podem sobreviver:
               é gente inventada com direito de entrar em unidade real */
            u.autorizados = []; u.veiculos = []; u.restricoes = []; u.obs = '';
            u.demo = false;
          }
        });
        S.credenciais = S.credenciais.filter(function(c){
          if(c.id.indexOf('cr-') === 0){ cred++; return false; }
          return true;
        });
        S.leituras = S.leituras.filter(function(l){ return l.cred.indexOf('cr-') !== 0; });
        S.demo = false; gravar(); fechar(); pintar();
        torrada('Cadastro em branco', cred + ' credenciais fictícias também foram removidas', 'ok');
      } } ]);
}

/* ══════════════════════════════════════════════════════════════
   EVENTOS
   ══════════════════════════════════════════════════════════════ */
function acao(nome, extra){
  var mapa = {
    novoAcesso:novoAcesso, novaEncomenda:novaEncomenda, novaOcorrencia:novaOcorrencia,
    novaRonda:function(){ novaRonda(); }, novaVenda:novaVenda, conferirQuadro:conferirQuadro,
    novoAtendimento:function(){ novoAtendimento(extra); }, portalPais:portalPais, novoContato:novoContato,
    fecharCaixa:fecharCaixa, novaSaida:function(){ novoLancamento('saida'); },
    novaEntrada:function(){ novoLancamento('entrada'); }, abrirTurno:abrirTurno,
    fecharTurno:fecharTurno, relatorioTurno:relatorioTurno, exportar:exportar, importar:importar,
    limparDemo:limparDemo, recarregar:recarregarExemplos,
    novaCredencial:novaCredencial, passagem:passagemManual,
    novaImpressao:novaImpressao, novaReservaCw:function(){ novaReservaCw(); },
    novaPiscina:novaPiscina, novoGourmet:function(){ novoGourmet(); },
    sairDemo:function(){ S.demo = false; gravar(); pintar(); torrada('Aviso removido','','ok'); }
  };
  if(mapa[nome]) mapa[nome]();
}

document.addEventListener('click', function(ev){
  var t = ev.target, el;
  if((el = t.closest('[data-fb]'))){
    var i = +el.getAttribute('data-fb');
    if(_ok && _ok[i]) _ok[i](); else fechar();
    return;
  }
  if((el = t.closest('[data-ir]'))){ ir(el.getAttribute('data-ir')); return; }
  if((el = t.closest('[data-act]'))){ acao(el.getAttribute('data-act'), el.getAttribute('data-tipo')); return; }
  if((el = t.closest('[data-saida]'))){ registrarSaida(el.getAttribute('data-saida')); return; }
  if((el = t.closest('[data-crach]'))){ cracha(el.getAttribute('data-crach')); return; }
  if((el = t.closest('[data-retirar]'))){ retirarEncomenda(el.getAttribute('data-retirar')); return; }
  if((el = t.closest('[data-chave]'))){ abrirChave(el.getAttribute('data-chave')); return; }
  if((el = t.closest('[data-ronda]'))){
    /* se a ronda daquele horário já existe hoje, abre a existente em vez
       de criar uma vazia por cima e sumir com a observação */
    var h = el.getAttribute('data-ronda'), ja = null;
    S.rondas.forEach(function(r){
      if(!ja && r.horario === h && dia(r.inicio) === dia()) ja = r;
    });
    if(ja) rondaAberta(ja.id); else novaRonda(h);
    return;
  }
  if((el = t.closest('[data-cam]'))){ alterarCamera(el.getAttribute('data-cam')); return; }
  if((el = t.closest('[data-pop]'))){ abrirPop(el.getAttribute('data-pop')); return; }
  if((el = t.closest('[data-emg]'))){
    var id = el.getAttribute('data-emg'), e = null;
    S.emergencias.forEach(function(x){ if(x.id === id) e = x; });
    if(e) abrirPop(e.pop, e.id);
    return;
  }
  if((el = t.closest('[data-oc]'))){ verOcorrencia(el.getAttribute('data-oc')); return; }
  if((el = t.closest('[data-un]'))){ fichaUnidade(el.getAttribute('data-un')); return; }
  if((el = t.closest('[data-fone]'))){ editarContato(el.getAttribute('data-fone')); return; }
  if((el = t.closest('[data-atend]'))){ verAtendimento(el.getAttribute('data-atend')); return; }
  if((el = t.closest('[data-lanc]'))){ verLancamento(el.getAttribute('data-lanc')); return; }
  if((el = t.closest('[data-ponto]'))){ marcarPonto(el.getAttribute('data-ponto')); return; }
  if((el = t.closest('[data-pp]'))){ marcarPasso(el.getAttribute('data-pp')); return; }
  if((el = t.closest('[data-cred]'))){ abrirCredencial(el.getAttribute('data-cred')); return; }
  if((el = t.closest('[data-cp]'))){ abrirCaixaPostal(el.getAttribute('data-cp')); return; }
  if((el = t.closest('[data-cw]'))){ novaReservaCw(el.getAttribute('data-cw')); return; }
  if((el = t.closest('[data-vcafe]'))){ venderCafe(el.getAttribute('data-vcafe')); return; }
  if((el = t.closest('[data-rcafe]'))){ reporCafe(el.getAttribute('data-rcafe')); return; }
  if((el = t.closest('[data-vend]'))){ venderVending(el.getAttribute('data-vend')); return; }
  if((el = t.closest('[data-repor]'))){ reporMaquina(el.getAttribute('data-repor')); return; }
  if((el = t.closest('[data-manut]'))){ defeitoMaquina(el.getAttribute('data-manut')); return; }
  if((el = t.closest('[data-gou]'))){
    var iso = el.getAttribute('data-gou'), res = null;
    S.gourmet.forEach(function(g){ if(!res && g.dia === iso) res = g; });
    if(res) abrirGourmet(res.id); else novoGourmet(iso);
    return;
  }
  if((el = t.closest('[data-gid]'))){ abrirGourmet(el.getAttribute('data-gid')); return; }
  if((el = t.closest('[data-quitar]'))){
    var vid = el.getAttribute('data-quitar');
    S.vendas.forEach(function(v){ if(v.id === vid){ v.quitado = true; v.quitadoEm = agora(); } });
    gravar(); pintar(); torrada('Fiado quitado','','ok');
    return;
  }
  if(t.id === 'fX' || t.id === 'scrim') fechar();
  if(t.id === 'btSos') ir('emergencia');
  if(t.id === 'btTema') trocarTema();
});

document.addEventListener('input', function(ev){
  if(ev.target.id === 'bsc'){
    BUSCA = ev.target.value;
    var pos = ev.target.selectionStart;
    pintar();
    var novo = document.getElementById('bsc');
    if(novo){ novo.focus(); novo.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', function(ev){
  if(ev.target.id === 'selAno'){ ANO_FILTRO = ev.target.value; pintar(); }
});
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape'){ fechar(); return; }
  /* Enter confirma o botão principal da janela aberta — o texto do botão
     de acesso prometia isso e não fazia nada. Textarea segue quebrando linha. */
  if(ev.key === 'Enter' && !ev.shiftKey &&
     document.getElementById('scrim').classList.contains('on') &&
     ev.target && ev.target.tagName !== 'TEXTAREA'){
    var bts = document.querySelectorAll('#fFoot .b');
    var prim = document.querySelector('#fFoot .b.p') || document.querySelector('#fFoot .b.d');
    if(prim){ ev.preventDefault(); prim.click(); }
    else if(bts.length){ ev.preventDefault(); bts[bts.length-1].click(); }
    return;
  }
  if(ev.altKey && ev.key >= '1' && ev.key <= '9'){
    var ordem = ['painel','acessos','encomendas','chaves','rondas','cameras','recepcao','alunos','telefones'];
    var v = ordem[+ev.key - 1];
    if(v){ ev.preventDefault(); fechar(); ir(v); }
  }
});
function trocarTema(){
  S.tema = S.tema === 'claro' ? 'escuro' : 'claro';
  document.documentElement.setAttribute('data-tema', S.tema === 'claro' ? 'claro' : 'escuro');
  gravar();
}

   As funções vivem dentro do módulo, então a navegação usa este
   mapa — não o objeto window.

TELAS = {

  telefones:v_telefones, emergencia:v_emergencia, ocorrencias:v_ocorrencias,
  coworking:v_coworking, vending:v_vending, areas:v_areas,
  caixa:v_caixa, auditoria:v_auditoria, turno:v_turno, manual:v_manual, dados:v_dados
};

carregar();
document.documentElement.setAttribute('data-tema', S.tema === 'claro' ? 'claro' : 'escuro');
document.getElementById('verRod').textContent = 'v' + VERSAO + ' · ' + DATA_VERSAO;
relogio(); setInterval(relogio, 1000);
setInterval(function(){ if(VIEW === 'painel' && !document.getElementById('scrim').classList.contains('on')) pintar(); }, 60000);
pintar();
})();
